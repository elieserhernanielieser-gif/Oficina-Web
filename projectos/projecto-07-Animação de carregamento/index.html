<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animações de carregamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Animações de carregamento</h1>

        <p class="subtitulo">
            Um spinner, um esqueleto com brilho e uma bolinha que pulsa.
        </p>

        <section class="card">
            <h2>Spinner</h2>

            <div class="spinner"></div>
        </section>

        <section class="card">
            <h2>Esqueleto</h2>

            <div class="esqueleto">
                <div class="imagem"></div>
                <div class="linha grande"></div>
                <div class="linha media"></div>
            </div>
        </section>

        <section class="card">
            <h2>Notificação</h2>

            <div class="pulse"></div>
        </section>

    </main>

</body>
</html>
