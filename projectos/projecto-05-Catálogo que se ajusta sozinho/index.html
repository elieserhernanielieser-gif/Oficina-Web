<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo que se ajusta sozinho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <h1>Catálogo que se ajusta sozinho</h1>

        <p class="descricao">
            Redimensiona a janela: os cartões reorganizam-se sem media queries.
        </p>

        <section class="cards">

            <article class="card">
                <span class="foto"></span>

                <h2 class="card-titulo">
                    Caderno
                </h2>

                <p class="card-preco">
                    $3
                </p>
            </article>

            <article class="card">
                <span class="foto"></span>

                <h2 class="card-titulo">
                    Caneta
                </h2>

                <p class="card-preco">
                    $5
                </p>
            </article>

            <article class="card">
                <span class="foto"></span>

                <h2 class="card-titulo">
                    Mochila
                </h2>

                <p class="card-preco">
                    $7
                </p>
            </article>

            <article class="card">
                <span class="foto"></span>

                <h2 class="card-titulo">
                    Garrafa
                </h2>

                <p class="card-preco">
                    $9
                </p>
            </article>

        </section>

    </main>

</body>
</html>
