<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Página de blog</h1>

        <p class="subtitulo">
            Cabeçalho, artigo, barra lateral e rodapé. No telemóvel ficam numa coluna.
        </p>

        <header class="cabecalho">
            <h2>O meu blog</h2>
        </header>

        <main class="conteudo">

            <article class="artigo">
                <h2>Como aprendi CSS</h2>

                <p>
                    Texto do artigo. Redimensiona a janela para veres a barra
                    lateral passar para baixo do artigo.
                </p>
            </article>

            <aside class="sidebar">
                <h2>Categorias</h2>

                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>Dicas</li>
                </ul>
            </aside>

        </main>

        <footer class="rodape">
            <p>2026. Todos os direitos reservados.</p>
        </footer>

    </div>

</body>
</html>
