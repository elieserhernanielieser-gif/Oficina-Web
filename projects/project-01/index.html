<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Catão de Perfil</title>
</head>
<body>
    
    <main>
        
        <h1>Cartão de Perfil</h1>
        <p>Avatar, textos, botões e números organizados com FlexBox.</p>
        <div class="container">
        <section>
            <span class="foto-perfil"></span>
            <h2 class="nome">Elieser Hernani</h2>
            <p class="descricao">Designer e professor de HTML e CSS.</p>
            <div class="botoes">
                <button class="btn btn-seguir">Seguir</button>
                <button class="btn btn-msg">Mensagem</button>
            </div>
            <hr class="linha">
        </section>
        <section class="estatistica">
            <ul>
                <li>
                    <h3>1,3 mil</h3>
                    <p>Seguidores</p>
                </li>
                <li>
                    <h3>340</h3>
                    <p>A seguir</p>
                </li>
                <li>
                    <h3>86</h3>
                    <p>Publicações</p>
                </li>
            </ul>
        </section>
        </div>
    </main>
</body>
</html>
